name: publish

# 上游一天发几十个构建，这里每天问一次最新版本：有新版本就渲染 PKGBUILD、
# 在干净的 Arch 容器里构建并验证、组装成 pacman 仓库，推到 gh-pages 与 Releases。
# 顺序是「先发布，最后提交」：中途失败时 main 上没有新 pkgver，下次运行重来一遍；
# 反过来先提交后失败，仓库会永远停在旧版本上。
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths: ["templates/**", "scripts/**", "tests/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (empty = upstream's latest)"
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The gates live in scripts/check.sh, pins and all, so a red run here
      # reproduces with `./scripts/check.sh` locally -- same commands, same
      # linter versions. That is why no lint command appears in this file.
      - name: Run the checks
        run: ./scripts/check.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialized on its own, not for the whole run: a queued publish must never
    # be overtaken, while a test run has no reason to wait behind one.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAGES_URL: https://eefung.github.io/magpie-repo
      # The three names this 软件源 is served under: the arch directory, the
      # section / database name, and the tree they are assembled in. They are
      # declared here, once, and the README's install block is held to the first
      # two by tests/test_inventory.py -- pacman keys the section off the
      # database's file name, so `[magpie]` and magpie.db.tar.gz are one fact,
      # not two. The arch 表 owns the other half (repo arch to upstream asset
      # suffix); adding an arch means this env and a second docker build, not
      # nine edits across four steps.
      ARCH: x86_64
      REPO_NAME: magpie
      # The tree the run assembles. `repo` used to be spelled in three steps and
      # eight places, so moving it -- or a second arch that wants a different
      # layout -- meant editing every one, and the seed could disagree with the
      # build about where the tree was.
      TREE: repo
      # The branch the 软件源 is served from. The seed reads it before it
      # fetches, and scripts/publish-pages.sh writes it: one name, two
      # consumers, both reading this line. A literal in each was two
      # spellings, and only the script's had a reader -- renaming that copy
      # left the seed fetching a branch nobody writes, which its
      # `no branch yet` path read as "first publish" with the 保留窗口 empty.
      PAGES_BRANCH: gh-pages
      # The 保留窗口: how many 版本 of each package the served tree keeps. The
      # number the README promises users, declared here so the copy they read
      # can be held to a value CI actually passes. build-repo.sh keeps a
      # default for a hand run; that is why the flag's presence is asserted as
      # text in tests/test_inventory.py rather than proved by the run.
      KEEP: 2
      # The entry check's own output: its four frozen lines and its log, one
      # stream in one file. Declared once, because the step that runs the check
      # redirects it here and its path used to be spelled seven times.
      UP: /tmp/up
      # The 包清单 this run builds and publishes from. It used to ride a frozen
      # line (`packages=`) whose one job was to name the file; with no script
      # between the check and the step, the job env is that one place.
      PKGS: /tmp/packages.txt
      # The repository whose Releases the fifth direction asks about. The
      # workflow hands over its own; the check reads this name and nothing else,
      # so a hand run points it wherever it means.
      RELEASE_REPO: ${{ github.repository }}
      # The bot both commits are signed by: the gh-pages squash that
      # scripts/publish-pages.sh makes and the main-branch PKGBUILD commit the
      # last step makes. The identity used to be spelled verbatim in both --
      # the script pinned to its own copy, the step to another -- and nothing
      # held the two together, so renaming the bot in one place shipped two
      # different committers. Declared here, once; both consumers reference it.
      GIT_NAME: github-actions[bot]
      GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7

      - name: What is upstream at, and what gets packaged
        id: upstream
        env:
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          # Whether this run publishes, and which 版本 it publishes, is the
          # entry check's answer: WANTED in, frozen lines out. This step relays
          # them and judges nothing. The judgement used to live right here,
          # where only a grep over this file could hold it: a reformat turned
          # the test job red, and flipping the default that decides "publish"
          # did not. It moved into a script, and then into the check itself,
          # which is where the comparison already lived.
          # The log goes into the file with the lines, so a failed check must
          # say both before it exits: the redirection is why `set -e` would
          # otherwise swallow the reason.
          if ! python3 scripts/bump.py --check > "$UP.txt"; then
            cat "$UP.txt" >&2
            echo "the entry check failed" >&2
            exit 1
          fi
          cat "$UP.txt"
          # Declared first, then written: `echo "x=$(reader)" >> "$GITHUB_OUTPUT"`
          # writes an empty value and exits 0 when the reader fails, which would
          # hand an empty 版本 to a step whose gate already opened. Reading
          # through the gates is what makes `bump=` and `pin=` 0 or 1 here: the
          # `if:` below cannot read a third value as "not 1" and skip the publish
          # in silence.
          upstream=""
          target=""
          bump=""
          pin=""
          frozen_var upstream "$UP.txt" upstream || exit 1
          frozen_var target "$UP.txt" target || exit 1
          frozen_var bump "$UP.txt" bump || exit 1
          frozen_var pin "$UP.txt" pin || exit 1
          printf 'upstream=%s\ntarget=%s\nbump=%s\npin=%s\n' \
            "$upstream" "$target" "$bump" "$pin" >> "$GITHUB_OUTPUT"
          # The 包清单 the build and release steps read: the path is declared
          # once in the job env, and the file is what `--packages` writes.
          python3 scripts/bump.py --packages > "$PKGS"

      - name: Render the PKGBUILDs
        id: render
        if: steps.upstream.outputs.bump == '1'
        env:
          TARGET: ${{ steps.upstream.outputs.target }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          # The 版本 is the one the check handed over -- a hand-picked one when
          # a human asked for it, otherwise the one --check just compared.
          # Asking 上游 again here was how a run rendered a version nobody had
          # checked; deciding it here was how a reformat could change it.
          target="$TARGET"
          [ -n "$target" ] || { echo "the check handed over no version to render" >&2; exit 1; }
          python3 scripts/bump.py --render --version "$target" | tee /tmp/render.txt
          git diff --stat
          # Every later step needs the same version; the renderer printed it.
          # Checking it here rather than letting an empty value flow on: the
          # failure would otherwise land after the gh-pages push, leaving a
          # half-published run the "publish first, commit last" order exists
          # to prevent. The gate refuses an absent line and a value that is not
          # a 版本 -- the same two answers, in one place.
          ver=""
          frozen_var ver /tmp/render.txt ver || exit 1
          # Out through the same carrier as the check's three facts, so the
          # suite's "every output has a reader" rule covers it too. This key
          # used to go to `$GITHUB_ENV`, a second carrier with none of those
          # rules -- one place where a dead handover could come back unseen.
          printf 'ver=%s\n' \
            "$ver" >> "$GITHUB_OUTPUT"

      - name: Build the packages and assemble the pacman repository
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          mkdir -p "$TREE"
          # Carry the last published 包文件 over, so an upgrade in flight does
          # not 404 and the 保留窗口 has something to keep. Which files count,
          # and which branch they come from, is scripts/seed-tree.sh's answer --
          # the line that used to decide it here read an exit status, and git
          # answers 2 for "no such branch" and 128 for "cannot ask": a network
          # or credential failure seeded an empty tree and the publish emptied
          # the window on top of it, green.
          ./scripts/seed-tree.sh "$TREE" "$ARCH" "$PAGES_BRANCH"
          # The dirs come from the 包清单 the check step wrote, not from this
          # file: a package added to the inventory is built without an edit
          # here. The file's path is declared once in the job env, so the two
          # steps that read it spell it nowhere.
          # They are named relative to the repository root, which is why this
          # container mounts $PWD and works from /src. Those two facts are one
          # assumption -- move the mount, keep the paths, and every build step
          # resolves a directory that is not there.
          # Captured first, not read through a process substitution:
          # `mapfile < <(reader)` exits 0 when the reader rejects a line, so a
          # malformed 包清单 would reach build-repo.sh as "name at least one
          # package directory" -- the wrong module, inside the container, with
          # the reader's own message already printed and ignored.
          dirs="$(pkglist_dirs "$PKGS")" || exit 1
          [ -n "$dirs" ] || { echo "the 包清单 names no package directories" >&2; exit 1; }
          mapfile -t pkgdirs <<<"$dirs"
          # REPO_NAME crosses into the container so the database is named after
          # the section the README tells users to write, instead of by the
          # script's own default agreeing with it by luck.
          docker run --rm --volume "$PWD:/src" --workdir /src \
            -e REPO_NAME -e KEEP \
            archlinux:base-devel \
            ./scripts/build-repo.sh "$TREE/$ARCH" "${pkgdirs[@]}"
          du -sh "$TREE/$ARCH"; ls -l "$TREE/$ARCH"
          git status --short

      - name: Publish the pacman repository to the served branch
        if: steps.upstream.outputs.bump == '1'
        env:
          VER: ${{ steps.render.outputs.ver }}
        run: |
          set -euo pipefail
          # What "publish to the pages branch" means -- `.nojekyll`, one
          # squashed commit per release, the force push -- is
          # scripts/publish-pages.sh's answer, and it runs offline against a
          # bare repository in tests/test_publish_pages.py. What is left here
          # is the one part a publish run still proves: the token URL.
          ./scripts/publish-pages.sh "$TREE" "$VER" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PAGES_BRANCH"
          echo "repository published: $PAGES_URL/$ARCH"

      # Before the commit, deliberately: a failure here leaves main at the old
      # pkgver, so the next run retries. With the commit first, a failed
      # release would leave main looking current and the release would never
      # exist -- no later run would try again.
      #
      # Which of the two shapes the step below uses is a value it is handed, not
      # the exit status of a lookup: `gh release view` failed the same way for
      # "no such Release" and "the API said no", so a transient failure took the
      # create path and reported `already_exists`.
      - name: Does this version already have a Release?
        id: release_state
        if: steps.upstream.outputs.bump == '1'
        env:
          VER: ${{ steps.render.outputs.ver }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          # The answer is a value GitHub gives (an HTTP status), read through
          # the one reader like every other handover.
          ./scripts/release-state.sh "$VER" "$GITHUB_REPOSITORY" > /tmp/release-state.txt
          cat /tmp/release-state.txt
          # Read through the gates: `release=` is one of two words and `tag=` is
          # a 版本 with a `v` in front, so the step that acts on them needs no
          # `case` of its own -- the domain is checked once, here.
          release=""
          tag=""
          frozen_var release /tmp/release-state.txt release || exit 1
          # The tag the lookup asked about, handed on rather than spelled
          # again: `v$VER` used to appear in five gh calls below, a second
          # place for a name this step already holds.
          frozen_var tag /tmp/release-state.txt tag || exit 1
          printf 'release=%s\ntag=%s\n' \
            "$release" "$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        if: steps.upstream.outputs.bump == '1'
        env:
          VER: ${{ steps.render.outputs.ver }}
          STATE: ${{ steps.release_state.outputs.release }}
          TAG: ${{ steps.release_state.outputs.tag }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          # What the release is made of -- this build's 包文件 only, the
          # SHA256SUMS built from exactly those, the notes whose install lines
          # come from the 包清单 -- is scripts/release.sh's answer. gh is what is
          # left here, and it is the only part a publish run can prove.
          # `$STATE` is one of the table's two words: the step that read it
          # refuses anything else, so this step acts on it instead of
          # re-deciding what it may be.
          ./scripts/release.sh "$TREE/$ARCH" "$VER" "$PKGS" /tmp/rel \
            > /tmp/release.txt
          cat /tmp/release.txt
          # Read through the table's gates, which answer for the shape: a list
          # naming no paths, or a path naming no file, fails here. The redirect
          # this used to be -- `mapfile < "$(reader)"` -- turned an empty list
          # into "no assets to upload" and let `gh release` finish green with
          # the checksums alone.
          assets=()
          sums=""
          notes=""
          frozen_list assets /tmp/release.txt assets || exit 1
          frozen_var sums /tmp/release.txt sums || exit 1
          frozen_var notes /tmp/release.txt notes || exit 1
          if [ "$STATE" = present ]; then
            # The tag exists -- but a rebuild of the same 版本 lands here with
            # different bytes, and the 软件源 now carries them (the entry check
            # compares the two). Leaving the old assets would describe one
            # build in the Release and another to pacman, so the assets and the
            # notes are replaced instead. `gh release upload` is the command
            # that makes this idempotent; nothing here is a new Release.
            gh release upload "$TAG" --clobber "${assets[@]}" "$sums"
            gh release edit "$TAG" --notes-file "$notes"
            echo "release $TAG updated: $(gh release view "$TAG" --json url -q .url)"
            exit 0
          fi
          gh release create "$TAG" \
            --title "magpie $VER" \
            --notes-file "$notes" \
            "${assets[@]}" "$sums"
          echo "release created: $(gh release view "$TAG" --json url -q .url)"

      # Last, so that every failure above is retried by the next run: main
      # still carries the old pkgver until this step succeeds.
      - name: Commit the rendered PKGBUILDs
        if: steps.upstream.outputs.bump == '1'
        env:
          VER: ${{ steps.render.outputs.ver }}
          PIN: ${{ steps.upstream.outputs.pin }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          # The step's own copy of the identity would be a second source for a
          # fact the job env already holds; both commits sign as it instead.
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          # A pinned 版本 is a rollback, and this is where it is recorded. The
          # entry check reads PINNED, so the next scheduled run stops reading a
          # deliberately older tree as 落后 and publishing 上游's 版本 over it --
          # a rollback used to last until the next 04:17, with no run saying it
          # had been undone. It lands in the same commit as the PKGBUILDs it
          # describes, which is what makes a forgotten pin a line in `git log`;
          # a run that is not holding back removes it, and so does deleting the
          # file.
          #
          # Which run is a rollback is `pin=`, from the module that does the
          # comparing: inferring it from "the dispatch input was non-empty" made
          # every re-run of the version the tree already carries -- the retry a
          # failed Release needs -- a pin nobody asked for, and a pin outlives
          # that run.
          if [ "$PIN" = 1 ]; then
            printf '%s\n' "$VER" > PINNED
            git add PINNED
          elif git ls-files --error-unmatch PINNED >/dev/null 2>&1; then
            git rm --quiet PINNED
          fi
          git add packages
          if git diff --cached --quiet; then
            echo "PKGBUILDs are already at $VER, nothing to commit"
          else
            git commit -m "build: magpie $VER"
            # A hand push landing mid-run would otherwise reject this one.
            git push || { git pull --rebase --autostash && git push; }
          fi

      - name: Say what was skipped
        if: steps.upstream.outputs.bump != '1'
        # `upstream` is the one output that had no reader: the entry check hands
        # it over, nothing consumed it, and a handover line nothing reads is a
        # promise the next person keeps guessing about. The line a skipped run
        # prints is exactly the place a human wants it -- which version the tree
        # already carries -- so it is the reader rather than a deletion.
        env:
          UPSTREAM: ${{ steps.upstream.outputs.upstream }}
        run: echo "packaged PKGBUILDs already match upstream $UPSTREAM; nothing to publish"
