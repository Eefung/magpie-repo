name: publish

# 上游一天发几十个构建，这里每天问一次最新版本：有新版本就渲染 PKGBUILD、
# 在干净的 Arch 容器里构建并验证、组装成 pacman 仓库，推到 gh-pages 与 Releases。
# 顺序是「先发布，最后提交」：中途失败时 main 上没有新 pkgver，下次运行重来一遍；
# 反过来先提交后失败，仓库会永远停在旧版本上。
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths: ["templates/**", "scripts/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (empty = upstream's latest)"
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAGES_URL: https://eefung.github.io/magpie-repo
    steps:
      - uses: actions/checkout@v4

      - name: What is upstream at?
        id: upstream
        env:
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/bump.py --check | tee /tmp/check.txt
          bump=0
          if [ -n "$WANTED" ]; then
            echo "asked for $WANTED"; bump=1
          else
            bump="$(sed -n 's/^bump=//p' /tmp/check.txt)"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Render the PKGBUILDs
        if: steps.upstream.outputs.bump == '1'
        env:
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$WANTED" ]; then
            python3 scripts/bump.py --render --version "$WANTED"
          else
            python3 scripts/bump.py --render
          fi
          git diff --stat
          # Every later step needs the same version; derive it once.
          echo "ver=$(sed -n 's/^pkgver=//p' packages/magpie-bin/PKGBUILD | tr -d "'\"")" \
            >> "$GITHUB_ENV"

      - name: Build the packages and assemble the pacman repository
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          mkdir -p repo
          # Carry the last published build over, so an upgrade in flight does
          # not 404 and the retention window has something to keep.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git archive FETCH_HEAD | tar -x -C repo
            echo "previous repository:"; ls repo/x86_64 || true
          else
            echo "no gh-pages yet, starting a fresh repository"
          fi
          docker run --rm --volume "$PWD:/src" --workdir /src \
            archlinux:base-devel \
            ./scripts/build-repo.sh repo/x86_64 packages/magpie-bin packages/magpie-cli-bin
          du -sh repo/x86_64; ls -l repo/x86_64
          git status --short

      - name: Publish the pacman repository to gh-pages
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          cd repo
          git init --quiet --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add --all
          git commit --quiet -m "repo: magpie $ver"
          # One squashed commit per release keeps the branch from growing a copy
          # of every 30 MB package it ever served.
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "repository published: $PAGES_URL/x86_64"

      - name: Commit the rendered PKGBUILDs
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          if git diff --cached --quiet; then
            echo "PKGBUILDs are already at $ver, nothing to commit"
          else
            git commit -m "upgpkg: magpie $ver"
            # A hand push landing mid-run would otherwise reject this one.
            git push || { git pull --rebase --autostash && git push; }
          fi

      - name: Publish the GitHub release
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "v$ver already has a release"
            exit 0
          fi
          cat > /tmp/notes.md <<EOF
          magpie $ver 的 x86_64 pacman 软件包。

          仓库：$PAGES_URL/x86_64

              sudo pacman -Syu                  # 先同步所有源（含 [magpie]），别单独 -Sy
              sudo pacman -S magpie-bin        # 桌面版
              sudo pacman -S magpie-cli-bin    # 终端版

          校验和见下方的 SHA256SUMS；上游版本说明见
          https://github.com/yetone/magpie-releases/releases/tag/v$ver
          EOF
          # Only this version: repo/x86_64 also carries the previous build for
          # the retention window, and those do not belong in this release.
          mkdir -p /tmp/rel
          (cd repo/x86_64 && sha256sum -- *-"$ver"-1-x86_64.pkg.tar.zst > /tmp/rel/SHA256SUMS)
          gh release create "v$ver" \
            --title "magpie $ver" \
            --notes-file /tmp/notes.md \
            repo/x86_64/*-"$ver"-1-x86_64.pkg.tar.zst /tmp/rel/SHA256SUMS
          echo "release created: $(gh release view "v$ver" --json url -q .url)"

      - name: Say what was skipped
        if: steps.upstream.outputs.bump != '1'
        run: echo "packaged version already matches upstream; nothing to publish"
