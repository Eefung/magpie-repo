name: publish

# 上游一天发几十个构建，这里每天问一次最新版本：有新版本就渲染 PKGBUILD、
# 在干净的 Arch 容器里构建并验证、组装成 pacman 仓库，推到 gh-pages 与 Releases。
# 顺序是「先发布，最后提交」：中途失败时 main 上没有新 pkgver，下次运行重来一遍；
# 反过来先提交后失败，仓库会永远停在旧版本上。
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths: ["templates/**", "scripts/**", "tests/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (empty = upstream's latest)"
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The gates live in scripts/check.sh, pins and all, so a red run here
      # reproduces with `./scripts/check.sh` locally -- same commands, same
      # linter versions. That is why no lint command appears in this file.
      - name: Run the checks
        run: ./scripts/check.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialized on its own, not for the whole run: a queued publish must never
    # be overtaken, while a test run has no reason to wait behind one.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAGES_URL: https://eefung.github.io/magpie-repo
      # The three names this 软件源 is served under: the arch directory, the
      # section / database name, and the tree they are assembled in. They are
      # declared here, once, and the README's install block is held to the first
      # two by tests/test_inventory.py -- pacman keys the section off the
      # database's file name, so `[magpie]` and magpie.db.tar.gz are one fact,
      # not two. The arch 表 owns the other half (repo arch to upstream asset
      # suffix); adding an arch means this env and a second docker build, not
      # nine edits across four steps.
      ARCH: x86_64
      REPO_NAME: magpie
      # The tree the run assembles. `repo` used to be spelled in three steps and
      # eight places, so moving it -- or a second arch that wants a different
      # layout -- meant editing every one, and the seed could disagree with the
      # build about where the tree was.
      TREE: repo
      # The 保留窗口: how many 版本 of each package the served tree keeps. The
      # number the README promises users, declared here so the copy they read
      # can be held to a value CI actually passes. build-repo.sh keeps a
      # default for a hand run; that is why the flag's presence is asserted as
      # text in tests/test_inventory.py rather than proved by the run.
      KEEP: 2
      # The run's own handover: scripts/upstream.sh takes a work dir and prints
      # its four frozen lines on stdout, so the step that runs it redirects them
      # here (and into the work dir's sibling). Declared once, because three
      # steps read the file and its path used to be spelled seven times -- two
      # of them `cat` -- while `packages=` existed precisely so that a path
      # would not be spelled twice.
      UP: /tmp/up
      # The bot both commits are signed by: the gh-pages squash that
      # scripts/publish-pages.sh makes and the main-branch PKGBUILD commit the
      # last step makes. The identity used to be spelled verbatim in both --
      # the script pinned to its own copy, the step to another -- and nothing
      # held the two together, so renaming the bot in one place shipped two
      # different committers. Declared here, once; both consumers reference it.
      GIT_NAME: github-actions[bot]
      GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7

      - name: What is upstream at, and what gets packaged
        id: upstream
        env:
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          # Whether this run publishes, and which 版本 it publishes, is decided
          # in scripts/upstream.sh: WANTED in, four frozen lines out -- the 版本
          # --check compared, the one to render, bump=0|1, and the 包清单 file.
          # This step relays them and judges nothing. The judgement used to live
          # right here, where only a grep over this file could hold it: a
          # reformat turned the test job red, and flipping the default that
          # decides "publish" did not.
          ./scripts/upstream.sh "$UP" > "$UP.txt"
          cat "$UP.txt"
          # Assigned first, then written: `echo "x=$(reader)" >> "$GITHUB_OUTPUT"`
          # writes an empty value and exits 0 when the reader fails, which would
          # hand an empty 版本 to a step whose gate already opened.
          upstream="$(line_field upstream "$UP.txt")"
          target="$(line_field target "$UP.txt")"
          bump="$(line_field bump "$UP.txt")"
          printf 'upstream=%s\ntarget=%s\nbump=%s\n' \
            "$upstream" "$target" "$bump" >> "$GITHUB_OUTPUT"

      - name: Render the PKGBUILDs
        if: steps.upstream.outputs.bump == '1'
        env:
          TARGET: ${{ steps.upstream.outputs.target }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          # The 版本 is the one the check handed over -- a hand-picked one when
          # a human asked for it, otherwise the one --check just compared.
          # Asking 上游 again here was how a run rendered a version nobody had
          # checked; deciding it here was how a reformat could change it.
          target="$TARGET"
          [ -n "$target" ] || { echo "the check handed over no version to render" >&2; exit 1; }
          python3 scripts/bump.py --render --version "$target" | tee /tmp/render.txt
          git diff --stat
          # Every later step needs the same version; the renderer printed it.
          # Checking it here rather than letting an empty value flow on: the
          # failure would otherwise land after the gh-pages push, leaving a
          # half-published run the "publish first, commit last" order exists
          # to prevent. line_field fails the step if the line is absent.
          ver="$(line_field ver /tmp/render.txt)"
          echo "ver=$ver" >> "$GITHUB_ENV"

      - name: Build the packages and assemble the pacman repository
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          mkdir -p "$TREE"
          # Carry the last published 包文件 over, so an upgrade in flight does
          # not 404 and the retention window has something to keep. Only the
          # package files: the tree is cumulative, so anything else would be
          # carried forward forever, frozen at the version that last wrote it
          # (SHA256SUMS used to be exactly that). The database is rebuilt from
          # the package files below, so it has nothing to gain from the seed.
          # The pattern is pkg.sh's, not this file's: what counts as a 包文件 is
          # one rule, and the seed carrying a different set from the one
          # build-repo prunes is how a retired package gets served forever.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git archive FETCH_HEAD | tar -x -C "$TREE" --wildcards "$ARCH/$(pkgfile_pattern)"
            echo "previous repository:"; ls "$TREE/$ARCH" || true
          else
            echo "no gh-pages yet, starting a fresh repository"
          fi
          # The dirs come from the 包清单 the check step wrote, not from this
          # file: a package added to the inventory is built without an edit
          # here. Its path is a frozen line too, so the two steps that read it
          # ask the producer instead of spelling a filename twice.
          # They are named relative to the repository root, which is why this
          # container mounts $PWD and works from /src. Those two facts are one
          # assumption -- move the mount, keep the paths, and every build step
          # resolves a directory that is not there.
          # Captured first, not read through a process substitution:
          # `mapfile < <(reader)` exits 0 when the reader rejects a line, so a
          # malformed 包清单 would reach build-repo.sh as "name at least one
          # package directory" -- the wrong module, inside the container, with
          # the reader's own message already printed and ignored.
          packages="$(line_field packages "$UP.txt")"
          dirs="$(pkglist_dirs "$packages")" || exit 1
          [ -n "$dirs" ] || { echo "the 包清单 names no package directories" >&2; exit 1; }
          mapfile -t pkgdirs <<<"$dirs"
          # REPO_NAME crosses into the container so the database is named after
          # the section the README tells users to write, instead of by the
          # script's own default agreeing with it by luck.
          docker run --rm --volume "$PWD:/src" --workdir /src \
            -e REPO_NAME -e KEEP \
            archlinux:base-devel \
            ./scripts/build-repo.sh "$TREE/$ARCH" "${pkgdirs[@]}"
          du -sh "$TREE/$ARCH"; ls -l "$TREE/$ARCH"
          git status --short

      - name: Publish the pacman repository to gh-pages
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          # What "publish to the pages branch" means -- `.nojekyll`, one
          # squashed commit per release, the force push -- is
          # scripts/publish-pages.sh's answer, and it runs offline against a
          # bare repository in tests/test_publish_pages.py. What is left here
          # is the one part a publish run still proves: the token URL.
          ./scripts/publish-pages.sh "$TREE" "$ver" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "repository published: $PAGES_URL/$ARCH"

      # Before the commit, deliberately: a failure here leaves main at the old
      # pkgver, so the next run retries. With the commit first, a failed
      # release would leave main looking current and the release would never
      # exist -- no later run would try again.
      - name: Publish the GitHub release
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/pkg.sh
          source scripts/lib/pkg.sh
          # What the release is made of -- this version's 包文件 only, the
          # SHA256SUMS built from exactly those, the notes whose install lines
          # come from the 包清单 -- is scripts/release.sh's answer. gh is what is
          # left here, and it is the only part a publish run can prove.
          packages="$(line_field packages "$UP.txt")"
          ./scripts/release.sh "$TREE/$ARCH" "$ver" "$packages" /tmp/rel \
            > /tmp/release.txt
          cat /tmp/release.txt
          mapfile -t assets < "$(line_field assets /tmp/release.txt)"
          if gh release view "v$ver" >/dev/null 2>&1; then
            # The tag exists -- but a rebuild of the same 版本 lands here with
            # different bytes, and the 软件源 now carries them (the entry check
            # compares the two). Leaving the old assets would describe one
            # build in the Release and another to pacman, so the assets and the
            # notes are replaced instead. `gh release upload` is the command
            # that makes this idempotent; nothing here is a new Release.
            gh release upload "v$ver" --clobber \
              "${assets[@]}" "$(line_field sums /tmp/release.txt)"
            gh release edit "v$ver" --notes-file "$(line_field notes /tmp/release.txt)"
            echo "release v$ver updated: $(gh release view "v$ver" --json url -q .url)"
            exit 0
          fi
          gh release create "v$ver" \
            --title "magpie $ver" \
            --notes-file "$(line_field notes /tmp/release.txt)" \
            "${assets[@]}" "$(line_field sums /tmp/release.txt)"
          echo "release created: $(gh release view "v$ver" --json url -q .url)"

      # Last, so that every failure above is retried by the next run: main
      # still carries the old pkgver until this step succeeds.
      - name: Commit the rendered PKGBUILDs
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          # The step's own copy of the identity would be a second source for a
          # fact the job env already holds; both commits sign as it instead.
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git add packages
          if git diff --cached --quiet; then
            echo "PKGBUILDs are already at $ver, nothing to commit"
          else
            git commit -m "build: magpie $ver"
            # A hand push landing mid-run would otherwise reject this one.
            git push || { git pull --rebase --autostash && git push; }
          fi

      - name: Say what was skipped
        if: steps.upstream.outputs.bump != '1'
        # `upstream` is the one output that had no reader: the entry check hands
        # it over, nothing consumed it, and a handover line nothing reads is a
        # promise the next person keeps guessing about. The line a skipped run
        # prints is exactly the place a human wants it -- which version the tree
        # already carries -- so it is the reader rather than a deletion.
        env:
          UPSTREAM: ${{ steps.upstream.outputs.upstream }}
        run: echo "packaged PKGBUILDs already match upstream $UPSTREAM; nothing to publish"
