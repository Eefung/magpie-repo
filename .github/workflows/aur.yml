name: aur

# Upstream cuts dozens of builds a day. Every run asks upstream for its newest
# release, renders the PKGBUILDs when it moved, proves the package builds and
# runs in a clean Arch container, then pushes PKGBUILD + .SRCINFO to the AUR.
on:
  schedule:
    - cron: "23 */3 * * *"
  push:
    branches: [main]
    paths: ["templates/**", "scripts/**", "packages/**", ".github/workflows/aur.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (empty = upstream's latest)"
        required: false

permissions:
  contents: write

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME || 'Eefung' }}
      AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL || 'eefung@tuta.io' }}
      AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: What is upstream at?
        id: upstream
        run: |
          set -euo pipefail
          python3 scripts/bump.py --check | tee /tmp/check.txt
          bump=0
          if [ -n "${{ inputs.version }}" ]; then
            echo "asked for ${{ inputs.version }}"; bump=1
          else
            bump="$(sed -n 's/^bump=//p' /tmp/check.txt)"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Render the PKGBUILDs
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -n "$version" ]; then
            python3 scripts/bump.py --render --version "$version"
          else
            python3 scripts/bump.py --render
          fi
          git diff --stat

      - name: Build and check both packages in clean Arch containers
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          for pkg in magpie-bin magpie-cli-bin; do
            echo "::group::$pkg"
            docker run --rm --volume "$PWD:/src" --workdir /src --env CLEAN=1 \
              archlinux:base-devel ./scripts/build-check.sh "packages/$pkg"
            echo "::endgroup::"
          done
          git status --short

      - name: Commit the rendered PKGBUILDs
        if: steps.upstream.outputs.bump == '1'
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^pkgver=//p' packages/magpie-bin/PKGBUILD | tr -d "'\"")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages templates
          git commit -m "upgpkg: magpie $ver"
          git push

      - name: Push to the AUR
        if: steps.upstream.outputs.bump == '1' && env.AUR_SSH_PRIVATE_KEY != ''
        env:
          AUR_HOST: aur.archlinux.org
        run: |
          set -euo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          if [ -n "${AUR_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519,rsa "$AUR_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<EOF
          Host $AUR_HOST
            HostName $AUR_HOST
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          ./scripts/publish.sh packages/magpie-bin packages/magpie-cli-bin

      - name: Say what was skipped
        if: steps.upstream.outputs.bump != '1'
        run: echo "packaged version already matches upstream; nothing to do"

      - name: Note the missing AUR key
        if: steps.upstream.outputs.bump == '1' && env.AUR_SSH_PRIVATE_KEY == ''
        run: |
          echo "::warning::AUR_SSH_PRIVATE_KEY is not set, so the PKGBUILDs were updated but not pushed to the AUR."
